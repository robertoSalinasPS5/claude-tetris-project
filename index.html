<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-controls">
      <button type="button" id="sound-btn" class="sound-btn" title="Activar/silenciar sonido" aria-pressed="true">🔊</button>
      <label class="theme-toggle" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-switch" aria-label="Cambiar tema claro/oscuro" />
        <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
      </label>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value combo-value idle" id="combo">—</span>
        </div>
        <div class="panel-section hidden" id="b2b-section">
          <span class="label">BACK-TO-BACK</span>
          <span class="value b2b-value" id="b2b">ACTIVO</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> o <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> o <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>

        <div class="overlay-screen hidden" id="pause-menu">
          <p class="pause-title">PAUSA</p>

          <div class="pause-view" id="pause-main">
            <div class="pause-options">
              <button type="button" class="menu-btn" id="resume-btn">Reanudar</button>
              <button type="button" class="menu-btn" id="menu-restart-btn">Reiniciar</button>
              <button type="button" class="menu-btn menu-btn-ghost" id="show-controls-btn">Ver controles</button>
            </div>

            <div class="pause-setting">
              <label class="label" for="start-level">NIVEL INICIAL</label>
              <select class="menu-select" id="start-level">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
              </select>
              <p class="pause-hint">Se aplica en la próxima partida</p>
            </div>
          </div>

          <div class="pause-view hidden" id="pause-controls">
            <ul class="menu-controls">
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> o <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> o <kbd>Esc</kbd> pausa</li>
            </ul>
            <button type="button" class="menu-btn menu-btn-ghost" id="back-controls-btn">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
