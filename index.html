<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-controls">
      <button type="button" id="sound-btn" class="sound-btn" title="Activar/silenciar sonido" aria-pressed="true">🔊</button>
      <label class="theme-toggle" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-switch" aria-label="Cambiar tema claro/oscuro" />
        <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
      </label>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value combo-value idle" id="combo">—</span>
        </div>
        <div class="panel-section hidden" id="b2b-section">
          <span class="label">BACK-TO-BACK</span>
          <span class="value b2b-value" id="b2b">ACTIVO</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div class="overlay-screen hidden" id="records-screen">
          <form class="record-form hidden" id="record-form">
            <label class="record-form-label" for="record-name">¡Entras en el top 5! Escribe tu nombre</label>
            <div class="record-form-row">
              <input type="text" id="record-name" maxlength="12" placeholder="JUGADOR"
                     autocomplete="off" spellcheck="false" />
              <button type="submit" id="record-save-btn">Guardar</button>
            </div>
          </form>

          <p class="records-title">MEJORES PUNTUACIONES</p>
          <table class="records-table" id="records-table">
            <thead>
              <tr>
                <th>#</th>
                <th>NOMBRE</th>
                <th class="num">PUNTOS</th>
                <th class="num">LÍN.</th>
                <th class="num">NIV.</th>
                <th class="num" title="Nivel inicial de la partida">INI.</th>
                <th class="num">COMBO</th>
              </tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p class="records-empty hidden" id="records-empty">Aún no hay récords guardados.</p>
          <p class="records-bests hidden" id="records-bests"></p>
          <button type="button" id="records-reset-btn">Borrar récords</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
